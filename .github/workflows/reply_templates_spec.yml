name: Reply templates specs
permissions:
  contents: read
on:
  push:
    branches:
      - feature/reply-templates
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise
      - name: Rubocop
        run: bundle exec rubocop app/models/canned_response*.rb app/policies/canned_response*.rb app/controllers/api/v1/accounts/canned_response*.rb db/migrate/20261024* spec/models/canned_response*_spec.rb spec/controllers/api/v1/accounts/canned_response*_spec.rb spec/factories/canned_response*.rb
      - name: Prepare database
        run: |
          bundle exec rake db:create
          bundle exec rake db:schema:load
      - name: Run specs
        run: bundle exec rspec --format documentation spec/models/canned_response_spec.rb spec/models/canned_response_category_spec.rb spec/controllers/api/v1/accounts/canned_responses_controller_spec.rb spec/controllers/api/v1/accounts/canned_response_categories_controller_spec.rb spec/models/account_spec.rb spec/models/user_spec.rb
      # Migrating from an empty database stops on an old upstream migration, so start from the
      # v4.19.0 schema, apply only this branch's migrations and compare the dump with schema.rb
      - name: Migrations match schema.rb
        run: |
          curl -sSfL https://raw.githubusercontent.com/chatwoot/chatwoot/v4.19.0/db/schema.rb -o db/schema.rb
          bundle exec rake db:drop db:create db:schema:load db:migrate
          git diff --exit-code db/schema.rb
