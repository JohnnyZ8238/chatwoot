<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reply Templates Prototype</title>
<style>
:root {
  --bg: #f6f8fc; --panel: #ffffff; --line: #e4e9f2; --line2: #eef2f8;
  --fg: #1f2d3d; --fg2: #52637a; --mute: #8a9ab0;
  --blue: #1f93ff; --blue-bg: #eaf4ff; --blue-d: #0b6fd0;
  --green-bg: #dcfce7; --green: #166534; --yellow-bg: #fef3c7; --yellow: #92400e;
  --amber: #f59e0b; --red: #dc2626;
  --mine: #059669; --mine-bg: #ecfdf5; --co: #4f46e5; --co-bg: #eef2ff;
  --shadow: 0 12px 32px rgba(15, 23, 42, .16);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13.5px/1.45 -apple-system, "Segoe UI", Inter, Roboto, sans-serif; overflow: hidden; }
button { font: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
.app { display: flex; height: 100vh; }

/* left icon rail */
.rail { width: 56px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 6px; flex: none; }
.rail .logo { width: 32px; height: 32px; border-radius: 9px; background: var(--blue); color: #fff; display: grid; place-items: center; font-weight: 700; margin-bottom: 10px; }
.rail button { width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--fg2); font-size: 18px; }
.rail button.on { background: var(--blue-bg); color: var(--blue); }
.rail .sp { flex: 1; }

/* conversation list */
.clist { width: 270px; background: var(--panel); border-right: 1px solid var(--line); flex: none; display: flex; flex-direction: column; }
.clist h2 { font-size: 16px; margin: 0; padding: 16px 16px 10px; }
.citem { padding: 10px 16px; border-top: 1px solid var(--line2); cursor: pointer; }
.citem.on { background: var(--blue-bg); box-shadow: inset 3px 0 0 var(--blue); }
.citem b { font-weight: 600; }
.citem .s { color: var(--fg2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.citem .m { color: var(--mute); font-size: 11.5px; }

/* chat */
.chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.chead { background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 18px; display: flex; align-items: center; gap: 10px; }
.av { width: 32px; height: 32px; border-radius: 50%; background: #c7d2fe; color: #3730a3; display: grid; place-items: center; font-weight: 600; flex: none; font-size: 12px; }
.msgs { flex: 1; overflow: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 8px; }
.bub { max-width: 68%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
.bub.in { background: var(--panel); border: 1px solid var(--line); align-self: flex-start; border-top-left-radius: 4px; }
.bub.out { background: var(--blue); color: #fff; align-self: flex-end; border-top-right-radius: 4px; }
.bub .t { font-size: 11px; opacity: .7; margin-top: 3px; }

.composer { position: relative; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 16px 12px; }
.ctabs { display: flex; gap: 14px; font-size: 12.5px; color: var(--fg2); margin-bottom: 6px; }
.ctabs .on { color: var(--blue); font-weight: 600; }
.composer textarea { width: 100%; min-height: 76px; max-height: 220px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; }
.composer textarea:focus { border-color: #9cc9ff; box-shadow: 0 0 0 3px #e3f0ff; }
.cbar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.cbar .sp { flex: 1; }
.hint { color: var(--mute); font-size: 12px; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px; padding: 6px 12px; }
.btn:hover { border-color: #c9d4e4; }
.btn.pri { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.pri:hover { background: var(--blue-d); }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--fg2); }
.btn.danger { color: var(--red); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* contact panel */
.cpanel { width: 270px; background: var(--panel); border-left: 1px solid var(--line); flex: none; padding: 16px; overflow: auto; }
.cpanel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--mute); margin: 16px 0 6px; }
.kv { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; font-size: 12.5px; }
.kv span:first-child { color: var(--fg2); }
.kv span:last-child { text-align: right; word-break: break-all; }

/* picker popup */
.picker { position: absolute; left: 16px; right: 16px; bottom: calc(100% - 4px); background: var(--panel); border: 1px solid #d6dde8; border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; z-index: 20; max-width: 640px; }
.ptabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line2); }
.ptab { border: 0; background: none; padding: 6px 10px; color: var(--fg2); border-bottom: 2px solid transparent; font-size: 12.5px; }
.ptab.on { color: var(--blue); border-color: var(--blue); font-weight: 600; }
.ptab .c { color: var(--mute); font-weight: 400; margin-left: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 7px 10px; }
.chip { border: 0; font-size: 11.5px; padding: 2px 9px; border-radius: 99px; background: #f1f5f9; color: #475569; }
.chip.on { background: var(--blue); color: #fff; }
.plist { max-height: 250px; overflow: auto; }
.prow { display: flex; gap: 8px; align-items: flex-start; padding: 7px 12px; border-top: 1px solid #f3f5f9; cursor: pointer; }
.prow.hl { background: var(--blue-bg); }
.prow .body { flex: 1; min-width: 0; }
.prow b { font-weight: 600; }
.prow .s { color: var(--fg2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.code { font-family: ui-monospace, Consolas, monospace; color: var(--blue); font-size: 11.5px; }
.star { border: 0; background: none; padding: 0 2px; font-size: 15px; line-height: 1.2; color: #cbd5e1; }
.star.on { color: var(--amber); }
.tag { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; font-weight: 500; white-space: nowrap; }
.tag.mine { background: var(--mine-bg); color: var(--mine); }
.tag.company { background: var(--co-bg); color: var(--co); }
.tag.cat { background: #f1f5f9; color: #475569; }
.pfoot { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; border-top: 1px solid var(--line2); background: #fafbfd; font-size: 11.5px; color: var(--fg2); }
.kbd { font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; border: 1px solid #cbd5e1; border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: #475569; background: #fff; }
.linkb { border: 0; background: none; color: var(--blue); padding: 0; font-size: 12px; }
.empty { padding: 18px 12px; color: var(--mute); text-align: center; }

/* fill form */
.fill { background: #fffbeb; padding: 10px 12px; }
.fill .top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px 12px; }
.fld label { display: block; font-size: 11.5px; color: var(--yellow); margin-bottom: 2px; }
.fld label i { color: var(--red); font-style: normal; }
.fld input, .fld select, .fld textarea { width: 100%; border: 1px solid #fcd34d; background: #fff; border-radius: 6px; padding: 5px 8px; outline: none; }
.fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--amber); box-shadow: 0 0 0 3px #fdecc8; }
.fld.bad input, .fld.bad select, .fld.bad textarea { border-color: var(--red); }
.dq { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.dq .chip { font-size: 11px; padding: 1px 7px; background: #fff; border: 1px solid #fde68a; color: var(--yellow); }
.dq .chip.on { background: var(--amber); border-color: var(--amber); color: #fff; }
.chead b, .chead .hint { white-space: nowrap; }
.preview { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 8px; white-space: pre-wrap; font-size: 12.5px; }
.v { border-radius: 4px; padding: 0 4px; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; white-space: nowrap; }
.v.auto { background: var(--green-bg); color: var(--green); }
.v.ask { background: var(--yellow-bg); color: var(--yellow); }
.v.val { font-family: inherit; font-size: inherit; }
.v.miss { background: #fee2e2; color: #991b1b; }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(15, 23, 42, .35); display: grid; place-items: center; z-index: 50; padding: 24px; }
.modal { background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); width: min(1060px, 100%); height: min(640px, 100%); display: flex; flex-direction: column; overflow: hidden; }
.mhead { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.mhead h2 { font-size: 15px; margin: 0; }
.mhead .sp { flex: 1; }
.mbody { flex: 1; display: flex; min-height: 0; }
.tree { width: 200px; border-right: 1px solid var(--line); overflow: auto; padding: 8px 0; flex: none; }
.tree .h { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--mute); padding: 10px 14px 4px; }
.tree button { display: flex; width: 100%; border: 0; background: none; text-align: left; padding: 5px 14px; color: var(--fg); justify-content: space-between; }
.tree button.on { background: var(--blue-bg); color: var(--blue); font-weight: 600; }
.tree button .c { color: var(--mute); font-weight: 400; font-size: 12px; }
.mlist { width: 320px; border-right: 1px solid var(--line); display: flex; flex-direction: column; flex: none; }
.mtools { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line2); }
.mtools input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; outline: none; }
.mtools select { border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; background: #fff; }
.mrows { flex: 1; overflow: auto; }
.mrow { display: flex; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line2); cursor: pointer; align-items: flex-start; }
.mrow.on { background: var(--blue-bg); }
.mrow .meta { font-size: 11.5px; color: var(--mute); margin-top: 2px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.mrow .grip { color: #cbd5e1; cursor: grab; padding-top: 1px; }
.mrow.drag-over { box-shadow: inset 0 2px 0 var(--blue); }
.mdetail { flex: 1; overflow: auto; padding: 16px; min-width: 0; }
.mdetail h3 { margin: 0 0 4px; font-size: 16px; }
.mdetail .acts { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 12px; }
.tpl-body { white-space: pre-wrap; background: #fafbfd; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }

/* settings page */
.settings { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.shead { background: var(--panel); border-bottom: 1px solid var(--line); padding: 14px 22px; display: flex; align-items: center; gap: 12px; }
.shead h1 { font-size: 18px; margin: 0; }
.shead .sp { flex: 1; }
.stabs { display: flex; gap: 2px; padding: 0 22px; background: var(--panel); border-bottom: 1px solid var(--line); }
.stab { border: 0; background: none; padding: 10px 14px; border-bottom: 2px solid transparent; color: var(--fg2); }
.stab.on { color: var(--blue); border-color: var(--blue); font-weight: 600; }
.sbody { flex: 1; display: flex; min-height: 0; }
.cats { width: 220px; background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 10px 0; flex: none; }
.cats .row { display: flex; align-items: center; gap: 4px; padding: 0 8px 0 0; }
.cats .row button.n { flex: 1; text-align: left; border: 0; background: none; padding: 6px 16px; display: flex; justify-content: space-between; color: var(--fg); }
.cats .row button.n.on { color: var(--blue); font-weight: 600; background: var(--blue-bg); }
.cats .row .ic { border: 0; background: none; color: var(--mute); padding: 2px 4px; visibility: hidden; }
.cats .row:hover .ic { visibility: visible; }
.cats .add { padding: 8px 16px; }
.tbl-wrap { flex: 1; overflow: auto; padding: 16px 22px; }
.note { background: var(--blue-bg); color: #0b4a8a; border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 12.5px; }
table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line2); vertical-align: top; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--mute); font-weight: 600; background: #fafbfd; }
td .s { color: var(--fg2); font-size: 12px; max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
td.small { min-width: 110px; }
td.acts { white-space: nowrap; text-align: right; }

/* template editor */
.editor { display: flex; min-height: 0; flex: 1; }
.eform { flex: 1.2; overflow: auto; padding: 16px; border-right: 1px solid var(--line); }
.eprev { flex: 1; overflow: auto; padding: 16px; background: #fafbfd; }
.frow { display: grid; grid-template-columns: 1fr 140px; gap: 10px; }
.frow3 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.f { margin-bottom: 12px; }
.f > label { display: block; font-size: 12px; font-weight: 600; color: var(--fg2); margin-bottom: 4px; }
.f input, .f select, .f textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; outline: none; background: #fff; }
.f textarea { min-height: 150px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
.f input:focus, .f select:focus, .f textarea:focus { border-color: #9cc9ff; box-shadow: 0 0 0 3px #e3f0ff; }
.f .err { color: var(--red); font-size: 12px; margin-top: 3px; }
.vbar { display: flex; gap: 6px; margin-bottom: 6px; position: relative; flex-wrap: wrap; }
.vmenu { position: absolute; top: 100%; left: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; z-index: 5; width: 360px; max-height: 320px; overflow: auto; }
.vmenu .g { font-size: 11px; text-transform: uppercase; color: var(--mute); padding: 6px 8px 2px; }
.vmenu button { display: flex; width: 100%; border: 0; background: none; text-align: left; padding: 4px 8px; border-radius: 6px; justify-content: space-between; gap: 8px; }
.vmenu button:hover { background: var(--blue-bg); }
.vmenu button span:last-child { color: var(--mute); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fields { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.fields .fr { display: grid; grid-template-columns: 110px 1fr 110px 1fr 70px; gap: 6px; padding: 8px; border-bottom: 1px solid var(--line2); align-items: center; font-size: 12.5px; }
.fields .fr:last-child { border-bottom: 0; }
.fields .fr.h { background: #fafbfd; color: var(--mute); font-size: 11px; text-transform: uppercase; }
.fields input, .fields select { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: #fff; }
.small { font-size: 12px; color: var(--fg2); }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1f2d3d; color: #fff; padding: 8px 16px; border-radius: 8px; z-index: 99; font-size: 13px; }
.who { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg2); }
.who select { border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; background: #fff; }
.proto { background: #fff7ed; color: #9a3412; font-size: 11.5px; padding: 2px 8px; border-radius: 99px; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
'use strict';
/* ---------- data ---------- */
const USERS = {
  sean: { id: 'sean', name: 'Sean Mo', first_name: 'Sean', email: 'sean@ivybid.ca', role: 'Administrator' },
  lily: { id: 'lily', name: 'Lily Chen', first_name: 'Lily', email: 'lily@ivybid.ca', role: 'Agent' },
};
const ACCOUNT = { name: 'ivybid', site: 'ivybid.ca', support_email: 'help@ivybid.ca' };
const CONVOS = [
  { id: 1042, inbox: 'Website chat', status: 'Open', contact: { name: 'Emily Zhang', email: 'emily.zhang@gmail.com', phone: '+1 416 555 0182', city: 'Toronto', country: 'Canada' },
    attrs: { order_no: 'IVY-20481', lot: "Agave titanota 'White Ice'", amount: '$186.00', tracking_no: '' },
    msgs: [{ in: 1, t: 'Hi! I won the Agave titanota last week. When will it ship?', at: '10:12' }] },
  { id: 1039, inbox: 'WhatsApp', status: 'Open', contact: { name: 'Marcus Lee', email: 'marcus.lee@outlook.com', phone: '+1 604 555 0144', city: 'Vancouver', country: 'Canada' },
    attrs: { order_no: 'IVY-20455', lot: 'Monstera Thai Constellation', amount: '$240.00', tracking_no: '7489 2201 5512' },
    msgs: [{ in: 1, t: 'The plant arrived but two leaves are yellow. Can I get a partial refund?', at: '09:40' }] },
  { id: 1031, inbox: 'Instagram', status: 'Pending', contact: { name: 'Sofia Rossi', email: '', phone: '', city: 'Montréal', country: 'Canada' },
    attrs: { order_no: '', lot: '', amount: '', tracking_no: '' },
    msgs: [{ in: 1, t: 'How do the auctions work? Do I pay when I bid?', at: 'Yesterday' }] },
];

/* auto variables: everything Chatwoot already knows */
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return d; };
const nextBizDay = () => { const d = new Date(); do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6); return d; };
const AUTO = [
  { g: 'Contact', k: 'contact.name', l: 'Full name', f: c => c.contact.name },
  { g: 'Contact', k: 'contact.first_name', l: 'First name', f: c => (c.contact.name || '').split(' ')[0] },
  { g: 'Contact', k: 'contact.last_name', l: 'Last name', f: c => (c.contact.name || '').split(' ').slice(1).join(' ') },
  { g: 'Contact', k: 'contact.email', l: 'Email', f: c => c.contact.email },
  { g: 'Contact', k: 'contact.phone', l: 'Phone', f: c => c.contact.phone },
  { g: 'Contact', k: 'contact.city', l: 'City', f: c => c.contact.city },
  { g: 'Contact', k: 'contact.country', l: 'Country', f: c => c.contact.country },
  { g: 'Conversation', k: 'conversation.id', l: 'Conversation #', f: c => '#' + c.id },
  { g: 'Conversation', k: 'conversation.inbox', l: 'Channel', f: c => c.inbox },
  { g: 'Conversation', k: 'conversation.order_no', l: 'Order number (attribute)', f: c => c.attrs.order_no },
  { g: 'Conversation', k: 'conversation.lot', l: 'Plant / lot (attribute)', f: c => c.attrs.lot },
  { g: 'Conversation', k: 'conversation.amount', l: 'Order amount (attribute)', f: c => c.attrs.amount },
  { g: 'Conversation', k: 'conversation.tracking_no', l: 'Tracking number (attribute)', f: c => c.attrs.tracking_no },
  { g: 'Agent', k: 'agent.name', l: 'Your full name', f: () => me().name },
  { g: 'Agent', k: 'agent.first_name', l: 'Your first name', f: () => me().first_name },
  { g: 'Agent', k: 'agent.email', l: 'Your email', f: () => me().email },
  { g: 'Account', k: 'account.name', l: 'Company name', f: () => ACCOUNT.name },
  { g: 'Account', k: 'account.site', l: 'Website', f: () => ACCOUNT.site },
  { g: 'Account', k: 'account.support_email', l: 'Support email', f: () => ACCOUNT.support_email },
  { g: 'Date & time', k: 'date.today', l: 'Today', f: () => fmtDate(new Date()) },
  { g: 'Date & time', k: 'date.tomorrow', l: 'Tomorrow', f: () => fmtDate(addDays(1)) },
  { g: 'Date & time', k: 'date.next_business_day', l: 'Next business day', f: () => fmtDate(nextBizDay()) },
  { g: 'Date & time', k: 'date.in_3_days', l: 'In 3 days', f: () => fmtDate(addDays(3)) },
  { g: 'Date & time', k: 'date.in_7_days', l: 'In 7 days', f: () => fmtDate(addDays(7)) },
  { g: 'Date & time', k: 'time.now', l: 'Current time', f: () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); } },
  { g: 'Date & time', k: 'time.greeting', l: 'Good morning / afternoon / evening', f: () => { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; } },
];
const AUTO_BY = Object.fromEntries(AUTO.map(a => [a.k, a]));
const FIELD_TYPES = { text: 'Short text', long: 'Long text', number: 'Number', money: 'Amount ($)', date: 'Date', select: 'Dropdown', yesno: 'Yes / No' };

const SEED = {
  cats: { company: ['Shipping', 'Refunds & returns', 'Auction rules', 'Plant care', 'Greetings'], sean: ['Repeat buyers', 'Uncategorized'], lily: ['My shortcuts'] },
  templates: [

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const human = k => k.replace(/[_.]+/g, ' ').replace(/^\w/, c => c.toUpperCase());

function toast(m) { let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); } t.textContent = m; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2200); }

/* ---------- variables ---------- */
const VAR_RE = /\{\{\s*([\w.]+)\s*(?:\|\s*default:\s*"([^"]*)"\s*)?\}\}/g;
function askKeys(body) { const out = []; body.replace(VAR_RE, (_, k) => { if (!AUTO_BY[k] && !out.includes(k)) out.push(k); }); return out; }
function fieldsOf(t) { return askKeys(t.body).map(k => Object.assign({ key: k, label: human(k), type: 'text' }, (t.fields || []).find(f => f.key === k) || {})); }
function initVals(t, c) {
  const v = {};
  fieldsOf(t).forEach(f => { v[f.key] = f.fromAttr && AUTO_BY[f.fromAttr] ? (AUTO_BY[f.fromAttr].f(c) || f.def || '') : (f.def != null ? f.def : (f.type === 'select' ? (f.options || [])[0] || '' : '')); });
  return v;
}
function fmtVal(f, v) {
  if (v === '' || v == null) return '';
  if (f.type === 'date') { const d = new Date(v + 'T12:00:00'); return isNaN(d) ? v : fmtDate(d); }
  if (f.type === 'money') return /^\$/.test(v) ? v : '$' + v;
  return v;
}
function resolve(t, c, vals) { // -> plain text
  const fs = Object.fromEntries(fieldsOf(t).map(f => [f.key, f]));
  return t.body.replace(VAR_RE, (_, k, d) => {
    if (AUTO_BY[k]) { const v = AUTO_BY[k].f(c); return v || (d != null ? d : ''); }
    const v = fmtVal(fs[k] || {}, (vals || {})[k]); return v || (d != null ? d : '');
  }).replace(/[ \t]+([,.!?])/g, '$1');
}
function previewHTML(t, c, vals, opts) { // body with coloured chips
  opts = opts || {};
  const fs = Object.fromEntries(fieldsOf(t).map(f => [f.key, f]));
  let out = '', last = 0; const body = t.body;
  body.replace(VAR_RE, (m, k, d, i) => {
    out += esc(body.slice(last, i)); last = i + m.length;
    if (AUTO_BY[k]) {
      const v = c ? AUTO_BY[k].f(c) : '';
      out += opts.raw || !c ? `<span class="v auto">${esc(k)}</span>` : v ? `<span class="v auto val">${esc(v)}</span>` : d != null ? `<span class="v auto val" title="fallback">${esc(d) || '∅'}</span>` : `<span class="v miss" title="No value">${esc(k)}</span>`;
    } else {
      const f = fs[k] || { label: human(k) }, v = fmtVal(f, (vals || {})[k]);
      out += opts.raw || !vals ? `<span class="v ask">${esc(f.label)}</span>` : v ? `<span class="v ask val">${esc(v)}</span>` : `<span class="v ask">${esc(f.label)}</span>`;
    }
    return m;
  });
  return out + esc(body.slice(last));
}
function fieldInput(f, v, id) {
  const a = `data-fk="${esc(f.key)}" id="${id}"`;
  if (f.type === 'select') return `<select ${a}>${(f.options || []).map(o => `<option value="${esc(o)}" ${o === v ? 'selected' : ''}>${esc(o.trim() || '(none)')}</option>`).join('')}</select>`;
  if (f.type === 'yesno') return `<select ${a}><option ${v === 'Yes' ? 'selected' : ''}>Yes</option><option ${v === 'No' ? 'selected' : ''}>No</option></select>`;
  if (f.type === 'long') return `<textarea ${a} rows="2">${esc(v)}</textarea>`;
  if (f.type === 'date') {
    const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    const quick = [['Today', new Date()], ['Tomorrow', addDays(1)], ['Next biz day', nextBizDay()], ['+3 days', addDays(3)], ['+7 days', addDays(7)]];
    return `<input ${a} type="date" value="${esc(v)}"><div class="dq">${quick.map(([l, d]) => `<button type="button" class="chip ${v === iso(d) ? 'on' : ''}" data-dq="${esc(f.key)}" data-dv="${iso(d)}">${l}</button>`).join('')}</div>`;
  }
  const ty = f.type === 'date' ? 'date' : f.type === 'number' ? 'text' : 'text';
  return `<input ${a} type="${ty}" value="${esc(v)}" ${f.type === 'money' ? 'placeholder="e.g. 40.00"' : ''} autocomplete="off">`;
}
function fieldsForm(t, vals, bad, prefix) {
  const fs = fieldsOf(t);
  if (!fs.length) return '';
  return `<div class="fgrid">${fs.map((f, i) => `<div class="fld ${bad && bad.includes(f.key) ? 'bad' : ''}"><label for="${prefix}${i}">${esc(f.label)}${f.required ? ' <i>*</i>' : ''}</label>${fieldInput(f, vals[f.key] || '', prefix + i)}</div>`).join('')}</div>`;
}
function missing(t, vals) { return fieldsOf(t).filter(f => f.required && !String(vals[f.key] || '').trim()).map(f => f.key); }
function markUsed(id) { const t = tpl(id); t.uses = (t.uses || 0) + 1; t.lastUsed = Date.now(); const r = recents(); const i = r.indexOf(id); if (i >= 0) r.splice(i, 1); r.unshift(id); r.length = Math.min(r.length, 15); save(); }
function toggleFav(id) { const f = favs(), i = f.indexOf(id); if (i >= 0) f.splice(i, 1); else f.push(id); save(); }

/* ---------- searching ---------- */
function match(t, q) {
  if (!q) return 1;
  q = q.toLowerCase();
  if (t.code === q) return 100; if (t.code.startsWith(q)) return 60;
  if (t.title.toLowerCase().startsWith(q)) return 40; if (t.title.toLowerCase().includes(q)) return 30;
  if ((t.cat || '').toLowerCase().includes(q)) return 15; if (t.body.toLowerCase().includes(q)) return 10;
  return 0;
}
function pickerItems() {
  const p = S.pk; let list = visible();
  if (p.tab === 'fav') list = favs().map(tpl).filter(Boolean);
  else if (p.tab === 'recent') list = recents().map(tpl).filter(Boolean);
  else if (p.tab === 'mine') list = list.filter(t => t.scope === S.user);
  else if (p.tab === 'company') list = list.filter(t => t.scope === 'company');
  if (p.cat) list = list.filter(t => t.cat === p.cat);
  const scored = list.map((t, i) => ({ t, s: match(t, p.q), i })).filter(x => x.s > 0);
  if (p.tab === 'fav' || p.tab === 'recent') scored.sort((a, b) => b.s - a.s || a.i - b.i);
  else scored.sort((a, b) => b.s - a.s || (isFav(b.t.id) - isFav(a.t.id)) || (b.t.uses || 0) - (a.t.uses || 0));
  return scored.map(x => x.t);
}

/* ---------- Ctrl+K library ---------- */
function libItems() {
  const L = S.lib; let list = visible();
  const [kind, val] = L.node.split(':');
  if (L.q && (kind === 'fav' || kind === 'recent')) list = list; // typing searches every template, not just this shortlist
  else if (kind === 'fav') list = favs().map(tpl).filter(Boolean);
  else if (kind === 'recent') list = recents().map(tpl).filter(Boolean);
  else if (kind === 'company') list = list.filter(t => t.scope === 'company' && (!val || t.cat === val));
  else if (kind === 'mine') list = list.filter(t => t.scope === S.user && (!val || t.cat === val));
  let rows = list.map((t, i) => ({ t, s: match(t, L.q), i })).filter(x => x.s > 0);
  const keepOrder = (kind === 'fav' || kind === 'recent') && L.sort === 'default';
  rows.sort((a, b) => L.q && b.s !== a.s ? b.s - a.s : keepOrder ? a.i - b.i : L.sort === 'az' ? a.t.title.localeCompare(b.t.title) : L.sort === 'recent' ? (b.t.lastUsed || 0) - (a.t.lastUsed || 0) : (b.t.uses || 0) - (a.t.uses || 0));
  return rows.map(x => x.t);
}

  if (!was || was.q !== s.q) S.pk.idx = 0;

}

    if (k === 'ArrowUp') { ev.preventDefault(); S.pk.idx = Math.max(0, S.pk.idx - 1); render(); return; }
    if ((k === 'ArrowRight' || k === 'ArrowLeft') && ev.altKey === false && x.selectionStart === S.pk.end) { ev.preventDefault(); const i = tabs.indexOf(S.pk.tab); S.pk.tab = tabs[(i + (k === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length]; S.pk.cat = ''; S.pk.idx = 0; render(); return; }
    if (k === 'Enter' || k === 'Tab') { if (items[S.pk.idx]) { ev.preventDefault(); pickTpl(items[S.pk.idx].id); } return; }
    if (k === 'Escape') { ev.preventDefault(); S.pk = null; render(); focusEditorEnd(); return; }
  }
  if (x.id === 'editor' && k === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); send(); }
});
function isLastField(x) { const all = [...document.querySelectorAll('#picker [data-fk]')]; return all[all.length - 1] === x; }
function focusPickerEditor() { const ta = document.getElementById('editor'); if (ta && S.pk) { ta.focus(); ta.setSelectionRange(S.pk.end, S.pk.end); } }
function send() {
  const c = convo(), t = (S.draft[c.id] || '').trim(); if (!t) return;
  const d = new Date(); c.msgs.push({ in: 0, t, at: pad(d.getHours()) + ':' + pad(d.getMinutes()), by: me().name }); S.draft[c.id] = ''; S.pk = null; render();
  const m = document.getElementById('msgs'); if (m) m.scrollTop = m.scrollHeight; focusEditorEnd();
}
document.addEventListener('mousedown', ev => { if (ev.target.closest('.prow,.ptab,.chip,.star,[data-act=openlib]') && document.activeElement && document.activeElement.id === 'editor') ev.preventDefault(); });
document.addEventListener('click', ev => {
  const el = ev.target instanceof Element ? ev.target : null; if (!el) return;
  const b = el.closest('[data-dq],[data-act],[data-go],[data-convo],[data-pktab],[data-pkcat],[data-pkpick],[data-fav],[data-node],[data-lsel],[data-stab],[data-scat],[data-catren],[data-catdel],[data-catup],[data-ins]');
  if (!b) { if (S.pk && !S.pk.fill && !el.closest('.composer')) { S.pk = null; render(); } if (S.set.ed && S.set.ed.vmenu && !el.closest('.vbar')) { S.set.ed.vmenu = false; render(); } return; }
  const d = b.dataset;
  if (d.dq) { const st = S.pk && S.pk.fill ? S.pk : S.lib; if (!st) return; st.vals[d.dq] = d.dv; if (st.bad) st.bad = st.bad.filter(k => k !== d.dq); render(); return; }
  if (d.fav) { ev.stopPropagation(); toggleFav(d.fav); render(); toast(isFav(d.fav) ? 'Pinned to Favorites' : 'Removed from Favorites'); if (S.view === 'chat' && S.pk) focusPickerEditor(); return; }
  if (d.go) { S.view = d.go; S.pk = null; render(); return; }
  if (d.convo) { S.convo = +d.convo; S.pk = null; render(); return; }
  if (d.pktab) { S.pk.tab = d.pktab; S.pk.cat = ''; S.pk.idx = 0; render(); focusPickerEditor(); return; }
  if (d.pkcat !== undefined) { S.pk.cat = d.pkcat; S.pk.idx = 0; render(); focusPickerEditor(); return; }
  if (d.pkpick) { pickTpl(d.pkpick); return; }
  if (d.node) { S.lib.node = d.node; S.lib.sel = null; S.lib.sort = 'default'; render(); return; }
  if (d.lsel) { selectLib(d.lsel); return; }
  if (d.stab) { S.set.tab = d.stab; S.set.cat = ''; render(); return; }
  if (d.scat !== undefined) { S.set.cat = d.scat; render(); return; }
  if (d.catup !== undefined) { const sc = S.set.tab === 'company' ? 'company' : S.user, a = catsOf(sc), i = +d.catup; if (i > 0) { [a[i - 1], a[i]] = [a[i], a[i - 1]]; save(); render(); } return; }
  if (d.catren) { const sc = S.set.tab === 'company' ? 'company' : S.user, n = (prompt('Rename category', d.catren) || '').trim(); if (!n || n === d.catren) return; const a = catsOf(sc); a[a.indexOf(d.catren)] = n; DB.templates.forEach(t => { if (t.scope === sc && t.cat === d.catren) t.cat = n; }); if (S.set.cat === d.catren) S.set.cat = n; save(); render(); return; }
  if (d.catdel) { const sc = S.set.tab === 'company' ? 'company' : S.user, a = catsOf(sc), n = DB.templates.filter(t => t.scope === sc && t.cat === d.catdel).length; if (!confirm(n ? `Delete “${d.catdel}”? Its ${n} template(s) move to “Uncategorized”.` : `Delete “${d.catdel}”?`)) return; a.splice(a.indexOf(d.catdel), 1); if (n) { if (!a.includes('Uncategorized')) a.push('Uncategorized'); DB.templates.forEach(t => { if (t.scope === sc && t.cat === d.catdel) t.cat = 'Uncategorized'; }); } S.set.cat = ''; save(); render(); return; }
  if (d.ins) { const e = S.set.ed, ta = document.getElementById('edBody'), p = ta ? ta.selectionStart : e.body.length, s = '{{' + d.ins + '}}'; e.body = e.body.slice(0, p) + s + e.body.slice(ta ? ta.selectionEnd : p); e.vmenu = false; render(); const t2 = document.getElementById('edBody'); if (t2) { t2.focus(); t2.setSelectionRange(p + s.length, p + s.length); } return; }

    case 'closelib': if (el === b || el.closest('.mhead')) { S.lib = null; render(); focusEditorEnd(); } break;
    case 'libinsert': libInsert(); break;
    case 'pkback': S.pk.fill = null; render(); focusPickerEditor(); break;
    case 'pkinsert': pkInsert(); break;
    case 'newtpl': openEditor(null); break;
    case 'edit': openEditor(d.id); break;
    case 'dup': openEditor(d.id, true); break;
    case 'del': { const t = tpl(d.id); if (confirm(`Delete “${t.title}”?`)) { DB.templates = DB.templates.filter(x => x.id !== d.id); Object.values(DB.fav).forEach(a => { const i = a.indexOf(d.id); if (i >= 0) a.splice(i, 1); }); Object.values(DB.recent).forEach(a => { const i = a.indexOf(d.id); if (i >= 0) a.splice(i, 1); }); save(); render(); toast('Deleted'); } break; }
    case 'newcat': { const sc = S.set.tab === 'company' ? 'company' : S.user, n = (prompt('New category name') || '').trim(); if (n && !catsOf(sc).includes(n)) { catsOf(sc).push(n); save(); render(); } break; }
    case 'edcancel': S.set.ed = null; render(); break;
    case 'edsave': saveEditor(); break;
    case 'vmenu': S.set.ed.vmenu = !S.set.ed.vmenu; render(); break;
    case 'addfield': { const n = (prompt('What should the agent fill in? (e.g. Refund amount)') || '').trim(); if (!n) break; const e = S.set.ed, key = n.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'field'; const ta = document.getElementById('edBody'), p = ta ? ta.selectionStart : e.body.length, s = '{{' + key + '}}'; e.body = e.body.slice(0, p) + s + e.body.slice(p); if (!e.fields.find(f => f.key === key)) e.fields.push({ key, label: n, type: 'text', required: true }); render(); break; }
    case 'reset': if (confirm('Reset all templates, favorites and categories to the demo data?')) { DB = JSON.parse(JSON.stringify(SEED)); save(); S.pk = S.lib = null; S.set.ed = null; render(); toast('Reset'); } break;
  }
});
/* drag to reorder favorites */
let dragId = null;
document.addEventListener('dragstart', ev => { const r = ev.target.closest && ev.target.closest('[data-drag]'); if (r) { dragId = r.dataset.drag; ev.dataTransfer.effectAllowed = 'move'; } });
document.addEventListener('dragover', ev => { const r = ev.target.closest && ev.target.closest('[data-drag]'); if (r && dragId) { ev.preventDefault(); document.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over')); r.classList.add('drag-over'); } });
document.addEventListener('drop', ev => { const r = ev.target.closest && ev.target.closest('[data-drag]'); if (!r || !dragId) return; ev.preventDefault(); const f = favs(), from = f.indexOf(dragId), to = f.indexOf(r.dataset.drag); if (from >= 0 && to >= 0 && from !== to) { f.splice(from, 1); f.splice(to, 0, dragId); save(); } dragId = null; render(); });
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over')); });

render();
